# Splunk Cloud — Reverse Proxy
# Servidor: STMPDMZPOCOB PROXY (10.250.5.12)
# Copiar a: /etc/nginx/conf.d/splunk-upstream.conf
#
# IMPORTANTE: Reemplazar SPLUNK_HEC_HOST con el endpoint real
# una vez que se reciba la URL por licencia Splunk Cloud.

upstream splunk_cloud {
    # Ejemplo: input-prd-pXXXXX.splunkcloud.com:443
    server CAMBIAR_POR_SPLUNK_CLOUD_HOST:443;
    keepalive 16;
}

server {
    listen 8444 ssl;
    server_name 10.250.5.12 splunk-proxy.icasa.local;

    ssl_certificate     /etc/nginx/ssl/proxy.crt;
    ssl_certificate_key /etc/nginx/ssl/proxy.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Splunk HEC endpoint
    location /services/collector {
        proxy_pass              https://splunk_cloud;
        proxy_ssl_server_name   on;
        proxy_ssl_verify        on;
        proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;

        proxy_set_header        Host CAMBIAR_POR_SPLUNK_CLOUD_HOST;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto https;

        # Preservar Authorization header (HEC token)
        proxy_pass_request_headers on;
    }

    # Splunk UF / management port forwarding (si aplica)
    location / {
        proxy_pass              https://splunk_cloud;
        proxy_ssl_server_name   on;
        proxy_ssl_verify        on;
        proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;

        proxy_set_header        Host CAMBIAR_POR_SPLUNK_CLOUD_HOST;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto https;
    }
}
