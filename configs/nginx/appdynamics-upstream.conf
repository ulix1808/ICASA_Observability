# AppDynamics SaaS — Reverse Proxy
# Servidor: STMPDMZPOCOB PROXY (10.250.5.12)
# Copiar a: /etc/nginx/conf.d/appdynamics-upstream.conf

upstream appd_controller {
    server teresa202606020142139.saas.appdynamics.com:443;
    keepalive 32;
}

upstream appd_analytics {
    server analytics.api.appdynamics.com:443;
    keepalive 16;
}

# Health check local
server {
    listen 443 ssl;
    server_name 10.250.5.12 appd-proxy.icasa.local;

    ssl_certificate     /etc/nginx/ssl/proxy.crt;
    ssl_certificate_key /etc/nginx/ssl/proxy.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # AppDynamics Controller — todo el tráfico de agentes
    location / {
        proxy_pass              https://appd_controller;
        proxy_ssl_server_name   on;
        proxy_ssl_name          teresa202606020142139.saas.appdynamics.com;
        proxy_ssl_verify        on;
        proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;

        proxy_set_header        Host teresa202606020142139.saas.appdynamics.com;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto https;

        proxy_connect_timeout   30s;
        proxy_send_timeout      60s;
        proxy_read_timeout      60s;
        proxy_http_version      1.1;
        proxy_set_header        Connection "";
    }
}

# Analytics Events API (SAP)
server {
    listen 8443 ssl;
    server_name 10.250.5.12 appd-proxy.icasa.local;

    ssl_certificate     /etc/nginx/ssl/proxy.crt;
    ssl_certificate_key /etc/nginx/ssl/proxy.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass              https://appd_analytics;
        proxy_ssl_server_name   on;
        proxy_ssl_name          analytics.api.appdynamics.com;
        proxy_ssl_verify        on;
        proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;

        proxy_set_header        Host analytics.api.appdynamics.com;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto https;
    }
}
