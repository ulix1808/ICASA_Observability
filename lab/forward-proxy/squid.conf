# Squid forward proxy — replica MONITOR 10.2.32.179:3128
# Túnel CONNECT hacia el reverse proxy; NO termina TLS (sin SSL Bump)

acl SSL_ports port 443
acl Safe_ports port 443
acl CONNECT method CONNECT
acl allowed_dest dstdomain appd-proxy.icasa.local
acl allowed_dest_suffix dstdomain .icasa.local

http_port 3128

# Permitir CONNECT solo hacia el reverse proxy en 443
http_access allow CONNECT SSL_ports allowed_dest
http_access allow CONNECT SSL_ports allowed_dest_suffix
http_access deny all

# Logs en archivo (stdio no funciona con usuario proxy en Squid 5)
access_log /var/log/squid/access.log squid
cache_log /var/log/squid/cache.log

# Sin cache — laboratorio
cache deny all
visible_hostname icasa-lab-squid
