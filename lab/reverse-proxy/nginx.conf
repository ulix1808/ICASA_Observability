# Reverse proxy Nginx — replica el proxy DMZ de ICASA
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 128;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;

    upstream mock_appd_controller {
        server mock-saas:8080;
        keepalive 8;
    }

    server {
        listen 443 ssl;
        server_name appd-proxy.icasa.local;

        ssl_certificate     /etc/nginx/ssl/proxy.crt;
        ssl_certificate_key /etc/nginx/ssl/proxy.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Health check — igual que producción ICASA
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Simula reenvío al Controller SaaS
        location / {
            proxy_pass              http://mock_appd_controller;
            proxy_http_version      1.1;
            proxy_set_header        Host teresa202606020142139.saas.appdynamics.com;
            proxy_set_header        X-Real-IP $remote_addr;
            proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header        Connection "";
        }
    }
}
