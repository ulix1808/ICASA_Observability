# Mock AppDynamics SaaS Controller — solo HTTP interno (TLS lo termina el reverse proxy)
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;

    server {
        listen 8080;
        server_name teresa202606020142139.saas.appdynamics.com;

        location /health {
            return 200 "OK (mock SaaS)\n";
            add_header Content-Type text/plain;
        }

        location /controller/ {
            return 200 '{"status":"UP","source":"mock-appd-saas"}\n';
            add_header Content-Type application/json;
        }

        location / {
            return 200 '{"message":"Mock AppDynamics Controller"}\n';
            add_header Content-Type application/json;
        }
    }
}
